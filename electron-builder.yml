appId: com.givingsmiles.clinic
productName: Giving Smiles
copyright: Copyright © 2026 Software Smiles™. All rights reserved.

directories:
  buildResources: resources
  output: release/${version}

# electron-vite externalizes the runtime dependencies; electron-builder copies the
# production dependency tree from package.json automatically (required for
# electron-updater, which has transitive dependencies).
files:
  - out/**/*
  - package.json

# Auto-update feed.
# We use the "generic" provider pointed at GitHub's stable "latest release" download
# path instead of the default GitHub provider. The GitHub provider relies on the
# releases.atom feed, which GitHub rate-limits/404s for unauthenticated clients; reading
# latest.yml directly from releases/latest/download is a plain file fetch and is reliable.
publish:
  provider: generic
  url: https://github.com/oofski/DentalClinicCRM/releases/latest/download
  channel: latest

# The sql.js WebAssembly engine must be a real file on disk (cannot run from inside the asar).
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  # Offline speech model + ONNX runtime for the Dental Scribe microphone.
  # Populated by `npm run fetch-models` before packaging.
  - from: resources/models
    to: models

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: GivingSmiles-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Giving Smiles
  installerHeaderIcon: resources/icon.ico
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico

# Linux target is used only for local smoke-testing during development.
linux:
  target:
    - AppImage
  category: Office
  icon: resources/icon.png

portable:
  artifactName: GivingSmiles-Portable.${ext}
