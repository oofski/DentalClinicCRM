name: Build Windows Installer

# Builds the downloadable Windows installer (.exe) on a real Windows runner.
# Download it from the run's "Artifacts" section, or attach to a Release by pushing a v* tag.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `npm install` (not `npm ci`) so a newly added dependency resolves even when
        # package-lock.json hasn't been regenerated in the same commit.
        run: npm install --no-audit --no-fund

      - name: Fetch offline speech model (Dental Scribe microphone)
        run: npm run fetch-models

      - name: Build renderer + main
        run: npm run build

      - name: Package Windows installer (NSIS + portable)
        run: npx electron-builder --win --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GivingSmiles-Windows
          path: |
            release/*/GivingSmiles-*.exe
            release/*/GivingSmiles-*.exe.blockmap
            release/*/latest.yml
          if-no-files-found: error

      - name: Read app version
        id: ver
        shell: bash
        run: echo "v=v$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/claude/busy-euler-vcFJl' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.v }}
          name: Giving Smiles ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.v }}
          body: |
            Giving Smiles — Dental Clinic Management (Windows installer).

            **New install:** download **GivingSmiles-Setup.exe** below and run it.
            **Already installed (v1.2.1 or newer):** no download needed — the app updates itself
            via *Settings → Software Updates*.

            (Windows SmartScreen may warn about an unsigned app — choose *More info → Run anyway*.
            `latest.yml` is the auto-update manifest; leave it attached.)
          files: |
            release/*/GivingSmiles-*.exe
            release/*/GivingSmiles-*.exe.blockmap
            release/*/latest.yml
